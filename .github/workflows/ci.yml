name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # engines.node is ">=18" (package.json): test the floor and current LTS.
        node-version: ["18.x", "20.x"]

    # A REAL Redis for the AuthStore conformance suite (tests/storage-conformance-redis.test.ts).
    #
    # MemoryAdapter is the normative reference implementation that every future backend is written
    # to match — but atomicity and expiry are properties of the ENGINE, and a mock only asserts we
    # mocked Redis the way we imagined it. Running the suite against the real thing is what makes
    # "MemoryAdapter matches Redis" a tested fact instead of a code comment.
    #
    # The suite SKIPS itself when REDIS_URL is unset (so `npm test` works on a laptop with no
    # Docker) — which means a missing service here would silently reduce it to zero cases. The
    # suite guards against exactly that: in CI it asserts REDIS_URL is set and fails if it isn't.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      REDIS_URL: redis://localhost:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      # Build BEFORE Test: tests/dual-bundle-vault.test.ts inspects the BUILT dist/
      # (a bundling-artifact invariant), which doesn't exist in a fresh CI checkout
      # until the build runs. Running Test first fails with "Built dist not found".
      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # Non-blocking: audit results depend on the upstream advisory DB and can
      # change without any code change. Promote to a hard gate by removing
      # `continue-on-error` once the dependency surface is clean.
      - name: Security audit (non-blocking)
        run: npm audit --audit-level=high
        continue-on-error: true
