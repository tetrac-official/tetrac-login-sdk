name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # engines.node is ">=18" (package.json): test the floor and current LTS.
        node-version: ["18.x", "20.x"]

    # A REAL Redis for the AuthStore conformance suite (tests/storage-conformance-redis.test.ts).
    #
    # MemoryAdapter is the normative reference implementation that every future backend is written
    # to match — but atomicity and expiry are properties of the ENGINE, and a mock only asserts we
    # mocked Redis the way we imagined it. Running the suite against the real thing is what makes
    # "MemoryAdapter matches Redis" a tested fact instead of a code comment.
    #
    # The suite SKIPS itself when REDIS_URL is unset (so `npm test` works on a laptop with no
    # Docker) — which means a missing service here would silently reduce it to zero cases. The
    # suite guards against exactly that: in CI it asserts REDIS_URL is set and fails if it isn't.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # A REAL Postgres for the SQL engine (ADR-002). SQLite already runs the full
      # conformance suite in-process on every `npm test` — this proves the DIALECT
      # ABSTRACTION holds: same engine code, different placeholder syntax, different upsert,
      # different DELETE…LIMIT, and all 24 cases still pass. If that's true, adding MySQL
      # really is ~30 lines rather than a security review.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tetrac_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # MySQL is the ACID TEST for ADR-002 — the engine with all three notorious hazards (no
      # DELETE…RETURNING, a case-insensitive default collation, silent truncation). It is also
      # the only place two real bugs surfaced: a semicolon inside a DDL comment shattering the
      # schema split, and mysql2 returning VARBINARY as Buffer so every key comparison failed.
      # Neither was visible on SQLite or Postgres, and neither was reachable from a mock.
      #
      # STRICT_ALL_TABLES on purpose: preflight refuses to boot without it (non-strict MySQL
      # truncates a wallet blob into invalid JSON and the user loses every wallet in it).
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: pw
          MYSQL_DATABASE: tetrac_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ppw"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      REDIS_URL: redis://localhost:6379
      POSTGRES_URL: postgres://postgres:postgres@localhost:5432/tetrac_test
      MYSQL_URL: mysql://root:pw@localhost:3306/tetrac_test

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      # Build BEFORE Test: tests/dual-bundle-vault.test.ts inspects the BUILT dist/
      # (a bundling-artifact invariant), which doesn't exist in a fresh CI checkout
      # until the build runs. Running Test first fails with "Built dist not found".
      - name: Build
        run: npm run build

      # The wallet-login message as SHIPPED: dist/ must emit a Sign In With Solana message
      # the reference parser accepts, and its server must reject every mismatched origin.
      - name: Verify SIWS login message (dist)
        run: node scripts/verify-siws-login.mjs

      - name: Test
        run: npm test

      # Non-blocking, and scoped to what actually SHIPS (`--omit=dev`): the published
      # package is `dist` over one runtime dependency, so a dev-toolchain advisory
      # (esbuild, js-yaml, …) is noise here while a RUNTIME regression is a real signal.
      # Audit results also track the upstream advisory DB and can change with no code
      # change. Promote to a hard gate by removing `continue-on-error` once the runtime
      # surface is clean.
      - name: Security audit — runtime deps (non-blocking)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
